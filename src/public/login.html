<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Login - OCR Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #09090b;
      --surface: #131317;
      --surface-2: #18181d;
      --surface-3: #1f1f26;
      --line: #2c2c35;
      --line-soft: #232329;
      --text-1: #ededf2;
      --text-2: #a7a7b1;
      --text-3: #6d6d78;
      --accent-1: #71717a;
      --grad-accent: linear-gradient(135deg, #3f3f46 0%, #71717a 50%, #b4b4be 100%);
      --err: #fb7185;
      --radius-md: .8rem;
      --font-ui: 'Inter', 'Noto Sans Thai', system-ui, 'Segoe UI', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-ui);
      color: var(--text-1);
      background:
        radial-gradient(1100px 700px at 88% -10%, rgba(255, 255, 255, .06), transparent 60%),
        radial-gradient(900px 600px at -8% 108%, rgba(255, 255, 255, .04), transparent 55%),
        var(--bg-0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      -webkit-font-smoothing: antialiased;
      cursor: default;
      user-select: none;
    }

    input { cursor: text; user-select: text; }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--line-soft);
      border-radius: 1.4rem;
      padding: 2.5rem 2.25rem 2rem;
      box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .6);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background-image: var(--grad-accent);
    }

    .mark {
      width: 60px; height: 60px;
      margin: 0 auto 1.1rem;
      border-radius: 1rem;
      background: var(--surface-2);
      border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      color: #b8b8c2;
    }

    .mark img { width: 42px; height: 42px; object-fit: contain; }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -.01em;
      background-image: var(--grad-accent);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub {
      text-align: center;
      font-size: .68rem;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: .45rem;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: .8rem 1rem;
      background: var(--surface-3);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      color: var(--text-1);
      font-family: var(--font-ui);
      font-size: .9rem;
      margin-bottom: 1.1rem;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input::placeholder { color: var(--text-3); }

    input:focus {
      outline: none;
      border-color: var(--accent-1);
      box-shadow: 0 0 0 3px rgba(148, 148, 160, .22);
    }

    button {
      width: 100%;
      padding: .85rem 1.5rem;
      border: none;
      border-radius: var(--radius-md);
      background-image: var(--grad-accent);
      color: #fff;
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: .92rem;
      cursor: pointer;
      transition: all .18s ease;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.12); }
    button:active { transform: translateY(0); }

    .error {
      display: none;
      align-items: center;
      gap: .5rem;
      background: rgba(251, 113, 133, .08);
      border: 1px solid rgba(251, 113, 133, .35);
      color: #fda4af;
      padding: .7rem 1rem;
      border-radius: var(--radius-md);
      font-size: .82rem;
      margin-bottom: 1rem;
    }

    .error.show { display: flex; }
  </style>
</head>

<body>
  <div class="card">
    <div class="mark">
      <img src="/img/glove_character.png" alt="">
    </div>
    <h1 id="siteName">OCR CENTER</h1>
    <p class="sub" id="siteSubtitle">STA-SK Fleet Monitor</p>

    <div class="error" id="error">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="username" placeholder="ชื่อผู้ใช้">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="รหัสผ่าน">

      <button type="submit">เข้าสู่ระบบ</button>
    </form>
  </div>

  <script>
    // show the configured site name on the login page too
    fetch('/api/settings')
      .then(r => r.json())
      .then(d => {
        if (!d.success) return;
        document.getElementById('siteName').textContent = d.settings.siteName;
        document.getElementById('siteSubtitle').textContent = d.settings.siteSubtitle;
        document.title = 'Login - ' + d.settings.siteName;
      })
      .catch(() => {});

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      err.classList.remove('show');
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (data.success) window.location.href = '/';
        else err.classList.add('show');
      } catch (e2) {
        err.classList.add('show');
      }
    });
  </script>
</body>

</html>
