<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>OCR Center - STA-SK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ===== Design tokens (shared with camera UI) ===== */
    :root {
      --bg-0: #09090b;
      --bg-1: #0e0e11;
      --surface: #131317;
      --surface-2: #18181d;
      --surface-3: #1f1f26;
      --line: #2c2c35;
      --line-soft: #232329;
      --text-1: #ededf2;
      --text-2: #a7a7b1;
      --text-3: #6d6d78;
      --accent-2: #b8b8c2;
      --grad-accent: linear-gradient(135deg, #3f3f46 0%, #71717a 50%, #b4b4be 100%);
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #fb7185;
      --info: #7dd3fc;
      --radius-lg: 1.1rem;
      --radius-md: .8rem;
      --radius-sm: .55rem;
      --font-ui: 'Inter', 'Noto Sans Thai', system-ui, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-ui);
      color: var(--text-1);
      background:
        radial-gradient(1100px 700px at 88% -10%, rgba(255, 255, 255, .05), transparent 60%),
        radial-gradient(900px 600px at -8% 108%, rgba(255, 255, 255, .035), transparent 55%),
        var(--bg-0);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      cursor: default;
      user-select: none;
    }

    ::selection { background: rgba(113, 113, 122, .45); }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; border: 2px solid var(--bg-0); }

    .icon {
      width: 1.1em; height: 1.1em; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      flex: none; display: inline-block; vertical-align: -.18em;
    }

    /* ===== Topbar ===== */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 1rem;
      padding: .8rem 1.5rem;
      background: rgba(14, 14, 17, .92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line-soft);
    }

    .brand { display: flex; align-items: center; gap: .7rem; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: var(--radius-sm);
      background: var(--surface-2); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center; color: var(--accent-2);
    }
    .brand h1 {
      font-size: 1rem; font-weight: 800; letter-spacing: -.01em;
      background-image: var(--grad-accent);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand small { display: block; font-size: .6rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }

    .sum-chips { margin-left: auto; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .chip {
      display: inline-flex; align-items: center; gap: .4rem;
      background: var(--surface-2); border: 1px solid var(--line-soft);
      border-radius: 999px; padding: .3rem .8rem;
      font-size: .72rem; font-weight: 600; color: var(--text-2);
    }
    .chip b { color: var(--text-1); font-family: var(--font-mono); }
    .chip.ok b { color: var(--ok); }
    .chip.err b { color: var(--err); }
    .chip.warn b { color: var(--warn); }

    .btn {
      display: inline-flex; align-items: center; gap: .4rem;
      background: var(--surface-2); border: 1px solid var(--line);
      color: var(--text-1); border-radius: var(--radius-sm);
      padding: .38rem .8rem; font-family: var(--font-ui);
      font-size: .72rem; font-weight: 600; cursor: pointer;
      transition: all .15s ease;
    }
    .btn:hover { background: var(--surface-3); }
    .btn.grad { background-image: var(--grad-accent); border: none; color: #fff; }
    .btn.grad:hover { filter: brightness(1.12); }

    .refresh-note { font-size: .64rem; color: var(--text-3); }

    /* ===== Groups ===== */
    .wrap { padding: 1.25rem 1.5rem 2rem; max-width: 1700px; margin: 0 auto; }

    .group-sec { margin-bottom: 1.4rem; }
    .group-head {
      display: flex; align-items: center; gap: .7rem;
      padding: .6rem .95rem;
      background: var(--surface-2); border: 1px solid var(--line-soft);
      border-left: 3px solid #71717a;
      border-radius: var(--radius-md);
      margin-bottom: .85rem; cursor: pointer;
    }
    .group-head.unassigned { border-left-color: var(--warn); }
    .chev { color: var(--text-3); transition: transform .18s ease; }
    .group-sec.collapsed .chev { transform: rotate(-90deg); }
    .group-sec.collapsed .grid { display: none; }
    .group-name { font-size: .86rem; font-weight: 700; letter-spacing: .01em; }
    .group-meta { font-size: .66rem; color: var(--text-3); font-family: var(--font-mono); }
    .group-meta .on { color: var(--ok); }
    .group-meta .al { color: var(--warn); }
    .group-actions { margin-left: auto; display: flex; gap: .3rem; }
    .gbtn {
      width: 26px; height: 26px; border-radius: var(--radius-sm);
      display: inline-flex; align-items: center; justify-content: center;
      background: none; border: 1px solid transparent; color: var(--text-3); cursor: pointer;
    }
    .gbtn:hover { background: var(--surface-3); border-color: var(--line); color: var(--text-1); }
    .gbtn .icon { width: .85rem; height: .85rem; }

    .grid {
      display: grid; gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    }

    .group-empty {
      grid-column: 1/-1; padding: 1.2rem; text-align: center;
      color: var(--text-3); font-size: .74rem;
      border: 1px dashed var(--line-soft); border-radius: var(--radius-md);
    }

    .empty {
      text-align: center; padding: 4rem 1rem; color: var(--text-3);
      background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius-lg);
      font-size: .85rem; line-height: 1.8;
    }
    .empty code { font-family: var(--font-mono); color: var(--text-2); background: var(--surface-3); padding: .1rem .45rem; border-radius: .35rem; }

    /* ===== Device card ===== */
    .card {
      background: var(--surface); border: 1px solid var(--line-soft);
      border-radius: var(--radius-lg); overflow: hidden; cursor: pointer;
      transition: transform .15s ease, border-color .15s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--line); }
    .card.offline { opacity: .65; }

    .card-head {
      display: flex; align-items: center; gap: .6rem;
      padding: .8rem 1rem; background: var(--surface-2);
      border-bottom: 1px solid var(--line-soft);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .dot.on { background: var(--ok); box-shadow: 0 0 8px rgba(52, 211, 153, .6); }
    .dot.off { background: var(--err); }
    .card-title { font-size: .85rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-sub { font-size: .64rem; color: var(--text-3); font-family: var(--font-mono); }
    .seen { margin-left: auto; font-size: .64rem; color: var(--text-3); white-space: nowrap; }

    .card-body { padding: .85rem 1rem 1rem; display: flex; flex-direction: column; gap: .7rem; }

    .badges { display: flex; flex-wrap: wrap; gap: .35rem; }
    .badge {
      font-size: .62rem; font-weight: 600; border-radius: .4rem; padding: .18rem .5rem;
      border: 1px solid;
    }
    .badge.warn { color: var(--warn); border-color: rgba(251, 191, 36, .4); background: rgba(251, 191, 36, .07); }
    .badge.error { color: var(--err); border-color: rgba(251, 113, 133, .4); background: rgba(251, 113, 133, .07); }
    .badge.okb { color: var(--ok); border-color: rgba(52, 211, 153, .35); background: rgba(52, 211, 153, .06); }

    .meters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; }
    .meter-tile { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: .45rem .55rem; }
    .meter-label { font-size: .56rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
    .meter-val { font-family: var(--font-mono); font-size: .78rem; font-weight: 600; margin: .1rem 0 .25rem; }
    .meter { height: 4px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
    .meter i { display: block; height: 100%; background: #8f8f99; border-radius: 99px; }
    .meter i.warn { background: var(--warn); }
    .meter i.crit { background: var(--err); }

    .read-row { display: flex; align-items: center; gap: .8rem; }
    .read-box {
      flex: 1; background: var(--surface-2); border: 1px solid var(--line-soft);
      border-radius: var(--radius-md); padding: .55rem .8rem;
    }
    .read-label { font-size: .56rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
    .read-val { font-family: var(--font-mono); font-size: 1.45rem; font-weight: 700; line-height: 1.2; }
    .read-val small { font-size: .62rem; font-weight: 500; color: var(--text-3); margin-left: .4rem; }
    .read-meta { font-size: .6rem; color: var(--text-3); font-family: var(--font-mono); }

    .thumb {
      width: 108px; height: 74px; flex: none; border-radius: var(--radius-sm);
      background: #0b0b0e; border: 1px solid var(--line-soft);
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      color: var(--text-3);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }

    .group-chip {
      display: inline-flex; align-items: center; gap: .45rem;
      align-self: flex-start;
      background: var(--surface-2); border: 1px dashed var(--line);
      border-radius: 999px; padding: .28rem .75rem;
      font-size: .68rem; font-weight: 600; color: var(--text-2);
      cursor: pointer; transition: all .15s ease;
    }
    .group-chip:hover { border-style: solid; background: var(--surface-3); color: var(--text-1); }
    .group-chip .icon { width: .8rem; height: .8rem; color: var(--text-3); }
    .group-chip.none { color: var(--warn); border-color: rgba(251, 191, 36, .45); }

    .cam-line { display: flex; align-items: center; gap: .45rem; font-size: .68rem; color: var(--text-2); flex-wrap: wrap; }
    .cam-line .st { font-family: var(--font-mono); font-size: .6rem; font-weight: 600; padding: .1rem .4rem; border-radius: .3rem; border: 1px solid var(--line); color: var(--text-3); }
    .cam-line .st.on { color: var(--ok); border-color: rgba(52, 211, 153, .35); }
    .cam-line .st.off { color: var(--err); border-color: rgba(251, 113, 133, .4); }

    /* ===== Move menu ===== */
    .move-menu {
      position: fixed; z-index: 100; min-width: 190px;
      background: var(--surface-2); border: 1px solid var(--line);
      border-radius: var(--radius-md); overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .55);
    }
    .move-menu .mi {
      display: flex; align-items: center; gap: .5rem;
      padding: .55rem .8rem; font-size: .74rem; color: var(--text-2);
      cursor: pointer; border-bottom: 1px solid var(--line-soft);
    }
    .move-menu .mi:last-child { border-bottom: none; }
    .move-menu .mi:hover { background: var(--surface-3); color: var(--text-1); }
    .move-menu .mi.current { color: var(--ok); }
    .move-menu .mi-head { padding: .45rem .8rem; font-size: .58rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); background: var(--surface); }

    /* ===== Detail modal ===== */
    .overlay {
      position: fixed; inset: 0; background: rgba(4, 6, 10, .75);
      backdrop-filter: blur(6px); z-index: 50;
      display: none; align-items: flex-start; justify-content: center;
      padding: 3vh 1rem; overflow-y: auto;
    }
    .overlay.show { display: flex; }
    .panel {
      width: 100%; max-width: 880px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 1.5rem;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, .6);
    }
    .panel-head { display: flex; align-items: center; gap: .8rem; padding-bottom: 1rem; margin-bottom: 1.2rem; border-bottom: 1px solid var(--line-soft); }
    .panel-title { font-size: 1.05rem; font-weight: 700; }
    .panel-sub { font-size: .68rem; color: var(--text-3); font-family: var(--font-mono); }
    .x-btn {
      margin-left: auto; width: 32px; height: 32px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      background: none; border: 1px solid transparent; color: var(--text-2); cursor: pointer;
    }
    .x-btn:hover { background: var(--surface-3); border-color: var(--line); color: #fff; }

    .sec-title { font-size: .64rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); margin: 1.1rem 0 .6rem; }

    table { width: 100%; border-collapse: collapse; font-size: .74rem; }
    thead th {
      text-align: left; font-size: .6rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-3); padding: .45rem .6rem; background: var(--surface-2);
      border-bottom: 1px solid var(--line-soft);
    }
    tbody td { padding: .4rem .6rem; border-bottom: 1px solid var(--line-soft); font-family: var(--font-mono); color: var(--text-2); }
    tbody td:first-child { color: var(--text-3); }
    tbody tr:hover { background: var(--surface-2); }
    .val-strong { color: var(--text-1); font-weight: 600; }
    .table-wrap { border: 1px solid var(--line-soft); border-radius: var(--radius-md); overflow: hidden; max-height: 320px; overflow-y: auto; }

    .detail-img { width: 100%; max-height: 300px; object-fit: contain; background: #0b0b0e; border: 1px solid var(--line-soft); border-radius: var(--radius-md); }
  </style>
</head>

<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><svg class="icon"><use href="#i-grid"/></svg></div>
      <div>
        <h1>OCR CENTER</h1>
        <small>STA-SK Fleet Monitor</small>
      </div>
    </div>
    <div class="sum-chips" id="sumChips"></div>
    <button class="btn grad" onclick="createGroup()">
      <svg class="icon"><use href="#i-plus"/></svg> New Group
    </button>
    <div class="refresh-note" id="refreshNote">refreshing...</div>
  </header>

  <main class="wrap" id="main">
    <div class="empty">Loading devices...</div>
  </main>

  <!-- Device detail -->
  <div class="overlay" id="detailOverlay">
    <div class="panel">
      <div class="panel-head">
        <div class="dot on" id="dDot"></div>
        <div>
          <div class="panel-title" id="dTitle">-</div>
          <div class="panel-sub" id="dSub">-</div>
        </div>
        <button class="x-btn" id="dDelete" title="ลบอุปกรณ์ออกจากระบบ" style="margin-left:auto"><svg class="icon"><use href="#i-trash"/></svg></button>
        <button class="x-btn" style="margin-left:0" onclick="closeDetail()"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
      <div id="dBody"></div>
    </div>
  </div>

  <script>
    const REFRESH_MS = 5000;
    let devices = [];
    let groups = [];
    let openDeviceId = null;
    const collapsed = new Set(JSON.parse(localStorage.getItem('ocrc-collapsed') || '[]'));

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtAgo = (sec) => sec < 60 ? sec + 's ago' : sec < 3600 ? Math.floor(sec/60) + 'm ago' : Math.floor(sec/3600) + 'h ago';
    const fmtTime = (iso) => iso ? new Date(iso).toLocaleString('th-TH', { hour12: false }) : '-';
    const meterCls = (v, warn, crit) => v >= crit ? 'crit' : v >= warn ? 'warn' : '';

    function meterTile(label, valText, pct, warnAt, critAt) {
      const bar = pct === null || pct === undefined ? '' :
        `<div class="meter"><i class="${meterCls(pct, warnAt, critAt)}" style="width:${Math.min(100, pct)}%"></i></div>`;
      return `<div class="meter-tile"><div class="meter-label">${label}</div><div class="meter-val">${valText}</div>${bar}</div>`;
    }

    function deviceCard(d) {
      const h = d.health || {};
      const cam = d.cameras[0] || {};
      const name = cam.display_name || d.hostname || d.deviceId;
      const disk = h.disk ? h.disk.usedPercent : null;
      const temp = h.cpuTempC;
      const ramPct = h.ram ? Math.round((h.ram.totalMb - h.ram.freeMb) / h.ram.totalMb * 100) : null;

      const badges = d.alerts.length
        ? d.alerts.map(a => `<span class="badge ${a.level}">${esc(a.text)}</span>`).join('')
        : '<span class="badge okb">HEALTHY</span>';

      const camLines = d.cameras.map(c => `
        <div class="cam-line">
          <svg class="icon"><use href="#i-video"/></svg> ${esc(c.display_name || c.camera_name)}
          <span class="st ${c.running ? 'on' : 'off'}">${c.running ? 'RUNNING' : 'STOPPED'}</span>
          ${c.plc_enabled ? `<span class="st ${c.plc_connected ? 'on' : 'off'}">PLC ${c.plc_connected ? 'OK' : 'DOWN'}</span>` : ''}
        </div>`).join('');

      const conf = cam.last_read_conf !== null && cam.last_read_conf !== undefined
        ? Math.round(cam.last_read_conf * 100) + '%' : '-';
      const weight = cam.weight !== null && cam.weight !== undefined ? cam.weight.toFixed(3) : '-';
      const imgUrl = `/api/devices/${encodeURIComponent(d.deviceId)}/cameras/${encodeURIComponent(cam.camera_name || '')}/image`;

      return `
      <div class="card ${d.online ? '' : 'offline'}" onclick="openDetail('${esc(d.deviceId)}')">
        <div class="card-head">
          <div class="dot ${d.online ? 'on' : 'off'}"></div>
          <div style="min-width:0">
            <div class="card-title">${esc(name)}</div>
            <div class="card-sub">${esc(d.hostname || '')} &middot; ${esc(d.ip || '?')}</div>
          </div>
          <div class="seen">${fmtAgo(d.lastSeenSec)}</div>
          <button class="gbtn" title="ย้ายกลุ่ม" onclick="event.stopPropagation(); openMoveMenu(event, '${esc(d.deviceId)}')">
            <svg class="icon"><use href="#i-move"/></svg>
          </button>
        </div>
        <div class="card-body">
          <div class="group-chip ${d.groupId ? '' : 'none'}" title="กดเพื่อเปลี่ยนกลุ่ม/plant"
               onclick="event.stopPropagation(); openMoveMenu(event, '${esc(d.deviceId)}')">
            <svg class="icon"><use href="#i-folder"/></svg>
            ${esc(groups.find(g => g.id === d.groupId)?.name || 'ยังไม่จัดกลุ่ม — กดเพื่อเลือก')}
            <svg class="icon"><use href="#i-chev"/></svg>
          </div>
          <div class="badges">${badges}</div>
          <div class="meters">
            ${meterTile('Temp', temp !== null && temp !== undefined ? temp + '&deg;C' : '-', temp !== null ? Math.round(temp / 90 * 100) : null, 72, 83)}
            ${meterTile('Disk', disk !== null ? disk + '%' : '-', disk, 75, 85)}
            ${meterTile('RAM', ramPct !== null ? ramPct + '%' : '-', ramPct, 80, 92)}
          </div>
          <div class="read-row">
            <div class="read-box">
              <div class="read-label">Last Read (to PLC)</div>
              <div class="read-val">${esc(cam.last_read_value ?? '-')}<small>conf ${conf}</small></div>
              <div class="read-meta">weight ${weight} &middot; ${cam.last_read_at ? fmtTime(cam.last_read_at) : 'no reads yet'}</div>
            </div>
            <div class="thumb">
              ${cam.last_image_at
                ? `<img src="${imgUrl}?t=${Date.parse(cam.last_image_at)}" alt="" loading="lazy">`
                : '<svg class="icon"><use href="#i-image"/></svg>'}
            </div>
          </div>
          ${camLines}
        </div>
      </div>`;
    }

    function groupSection(group, members) {
      const gid = group ? group.id : 'unassigned';
      const isCollapsed = collapsed.has(String(gid));
      const online = members.filter(d => d.online).length;
      const alerts = members.reduce((n, d) => n + d.alerts.length, 0);
      const idx = group ? groups.findIndex(g => g.id === group.id) : -1;
      const actions = group ? `
        <div class="group-actions">
          <button class="gbtn" title="เลื่อนกลุ่มขึ้น" ${idx <= 0 ? 'disabled style="opacity:.25;cursor:default"' : ''}
            onclick="event.stopPropagation(); moveGroup(${group.id}, -1)"><svg class="icon" style="transform:rotate(180deg)"><use href="#i-chev"/></svg></button>
          <button class="gbtn" title="เลื่อนกลุ่มลง" ${idx >= groups.length - 1 ? 'disabled style="opacity:.25;cursor:default"' : ''}
            onclick="event.stopPropagation(); moveGroup(${group.id}, 1)"><svg class="icon"><use href="#i-chev"/></svg></button>
          <button class="gbtn" title="เปลี่ยนชื่อกลุ่ม" onclick="event.stopPropagation(); renameGroup(${group.id}, '${esc(group.name)}')"><svg class="icon"><use href="#i-edit"/></svg></button>
          <button class="gbtn" title="ลบกลุ่ม" onclick="event.stopPropagation(); deleteGroup(${group.id}, '${esc(group.name)}', ${members.length})"><svg class="icon"><use href="#i-trash"/></svg></button>
        </div>` : '<div class="group-actions"></div>';

      return `
      <section class="group-sec ${isCollapsed ? 'collapsed' : ''}" data-gid="${gid}">
        <div class="group-head ${group ? '' : 'unassigned'}" onclick="toggleGroup('${gid}')">
          <svg class="icon chev"><use href="#i-chev"/></svg>
          <svg class="icon" style="color:var(--text-3)"><use href="#i-folder"/></svg>
          <span class="group-name">${group ? esc(group.name) : 'ยังไม่จัดกลุ่ม (Unassigned)'}</span>
          <span class="group-meta"><span class="on">${online}</span>/${members.length} online${alerts ? ` &middot; <span class="al">${alerts} alerts</span>` : ''}</span>
          ${actions}
        </div>
        <div class="grid">
          ${members.length ? members.map(deviceCard).join('')
            : '<div class="group-empty">ไม่มีอุปกรณ์ในกลุ่มนี้ &mdash; กดปุ่มย้าย (ลูกศร) บนการ์ดอุปกรณ์เพื่อย้ายเข้ากลุ่ม</div>'}
        </div>
      </section>`;
    }

    function render() {
      const main = document.getElementById('main');
      if (!devices.length && !groups.length) {
        main.innerHTML = `<div class="empty">
          ยังไม่มีอุปกรณ์เชื่อมต่อ<br>
          ตั้งค่าที่หน้าเว็บกล้อง: System &rarr; Central Server API &rarr; Central API URL<br>
          <code>http://&lt;IP เครื่องนี้&gt;:${location.port || 8090}/api/devices/heartbeat</code><br>
          อุปกรณ์จะปรากฏที่นี่อัตโนมัติเมื่อ heartbeat แรกเข้ามา
        </div>`;
        return;
      }
      const sections = [];
      for (const g of groups) {
        sections.push(groupSection(g, devices.filter(d => d.groupId === g.id)));
      }
      const unassigned = devices.filter(d => !d.groupId || !groups.some(g => g.id === d.groupId));
      if (unassigned.length || !groups.length) {
        sections.push(groupSection(null, unassigned));
      }
      main.innerHTML = sections.join('');
    }

    async function refresh() {
      try {
        const [sumRes, devRes, grpRes] = await Promise.all([
          fetch('/api/summary').then(r => r.json()),
          fetch('/api/devices').then(r => r.json()),
          fetch('/api/groups').then(r => r.json()),
        ]);
        devices = devRes.devices || [];
        groups = grpRes.groups || [];

        document.getElementById('sumChips').innerHTML = `
          <span class="chip">Groups <b>${groups.length}</b></span>
          <span class="chip">Devices <b>${sumRes.total}</b></span>
          <span class="chip ok">Online <b>${sumRes.online}</b></span>
          <span class="chip ${sumRes.offline ? 'err' : ''}">Offline <b>${sumRes.offline}</b></span>
          <span class="chip ${sumRes.alerts ? 'warn' : ''}">Alerts <b>${sumRes.alerts}</b></span>`;

        render();
        document.getElementById('refreshNote').textContent =
          'updated ' + new Date().toLocaleTimeString('th-TH', { hour12: false });
        if (openDeviceId) renderDetail();
      } catch (e) {
        document.getElementById('refreshNote').textContent = 'refresh failed';
      }
    }

    /* ===== Group management ===== */
    function toggleGroup(gid) {
      const key = String(gid);
      collapsed.has(key) ? collapsed.delete(key) : collapsed.add(key);
      localStorage.setItem('ocrc-collapsed', JSON.stringify([...collapsed]));
      render();
    }

    async function createGroup() {
      const name = prompt('ชื่อกลุ่มใหม่ (เช่น โรงงาน A, Line ผลิต 1):');
      if (!name || !name.trim()) return;
      const r = await fetch('/api/groups', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name.trim() }) });
      const res = await r.json();
      if (!res.success) alert(res.error || 'create failed');
      refresh();
    }

    async function renameGroup(id, current) {
      const name = prompt('ชื่อกลุ่มใหม่:', current);
      if (!name || !name.trim() || name.trim() === current) return;
      const r = await fetch('/api/groups/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name.trim() }) });
      const res = await r.json();
      if (!res.success) alert(res.error || 'rename failed');
      refresh();
    }

    async function moveGroup(id, direction) {
      const ids = groups.map(g => g.id);
      const i = ids.indexOf(id);
      const j = i + direction;
      if (i < 0 || j < 0 || j >= ids.length) return;
      [ids[i], ids[j]] = [ids[j], ids[i]];
      // apply locally right away so the section slides without waiting for refresh
      groups.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
      render();
      await fetch('/api/groups/reorder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids }) });
      refresh();
    }

    async function deleteGroup(id, name, memberCount) {
      const note = memberCount ? `\nอุปกรณ์ ${memberCount} ตัวในกลุ่มจะย้ายไป "ยังไม่จัดกลุ่ม"` : '';
      if (!confirm(`ลบกลุ่ม "${name}"?${note}`)) return;
      await fetch('/api/groups/' + id, { method: 'DELETE' });
      refresh();
    }

    /* ===== Move device between groups ===== */
    function closeMoveMenu() {
      const m = document.getElementById('moveMenu');
      if (m) m.remove();
    }

    function openMoveMenu(ev, deviceId) {
      closeMoveMenu();
      const d = devices.find(x => x.deviceId === deviceId);
      if (!d) return;
      const menu = document.createElement('div');
      menu.id = 'moveMenu';
      menu.className = 'move-menu';
      menu.innerHTML = `
        <div class="mi-head">ย้ายไปกลุ่ม</div>
        ${groups.map(g => `
          <div class="mi ${d.groupId === g.id ? 'current' : ''}" onclick="moveDevice('${esc(deviceId)}', ${g.id})">
            <svg class="icon"><use href="#i-folder"/></svg> ${esc(g.name)}
          </div>`).join('')}
        <div class="mi ${!d.groupId ? 'current' : ''}" onclick="moveDevice('${esc(deviceId)}', null)">
          <svg class="icon"><use href="#i-x"/></svg> ยังไม่จัดกลุ่ม
        </div>
        <div class="mi" onclick="createGroupAndMove('${esc(deviceId)}')">
          <svg class="icon"><use href="#i-plus"/></svg> สร้างกลุ่มใหม่...
        </div>`;
      document.body.appendChild(menu);
      const pad = 8;
      const rect = menu.getBoundingClientRect();
      let x = ev.clientX, y = ev.clientY;
      if (x + rect.width > innerWidth - pad) x = innerWidth - rect.width - pad;
      if (y + rect.height > innerHeight - pad) y = innerHeight - rect.height - pad;
      menu.style.left = x + 'px';
      menu.style.top = y + 'px';
      setTimeout(() => document.addEventListener('click', closeMoveMenu, { once: true }), 0);
    }

    async function moveDevice(deviceId, groupId) {
      closeMoveMenu();
      await fetch('/api/devices/' + encodeURIComponent(deviceId) + '/group', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ groupId })
      });
      refresh();
    }

    async function createGroupAndMove(deviceId) {
      closeMoveMenu();
      const name = prompt('ชื่อกลุ่มใหม่:');
      if (!name || !name.trim()) return;
      const r = await fetch('/api/groups', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name.trim() }) });
      const res = await r.json();
      if (res.success) await moveDevice(deviceId, res.id);
      else { alert(res.error || 'create failed'); refresh(); }
    }

    /* ===== Detail modal ===== */
    async function openDetail(id) {
      openDeviceId = id;
      document.getElementById('detailOverlay').classList.add('show');
      renderDetail();
    }

    function closeDetail() {
      openDeviceId = null;
      document.getElementById('detailOverlay').classList.remove('show');
    }

    document.getElementById('detailOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'detailOverlay') closeDetail();
    });

    document.getElementById('dDelete').addEventListener('click', async () => {
      const d = devices.find(x => x.deviceId === openDeviceId);
      if (!d) return;
      const name = d.cameras[0]?.display_name || d.hostname || d.deviceId;
      if (!confirm(`ลบอุปกรณ์ "${name}" ออกจากระบบ?\nประวัติการอ่านและข้อมูลทั้งหมดจะถูกลบ\n(ถ้าเครื่องยังส่ง heartbeat อยู่ จะกลับเข้ามาใหม่เองอัตโนมัติ)`)) return;
      await fetch('/api/devices/' + encodeURIComponent(d.deviceId), { method: 'DELETE' });
      closeDetail();
      refresh();
    });

    async function renderDetail() {
      const d = devices.find(x => x.deviceId === openDeviceId);
      if (!d) return;
      const cam = d.cameras[0] || {};
      const h = d.health || {};
      const groupName = groups.find(g => g.id === d.groupId)?.name || 'ยังไม่จัดกลุ่ม';

      document.getElementById('dDot').className = 'dot ' + (d.online ? 'on' : 'off');
      document.getElementById('dTitle').textContent = cam.display_name || d.hostname || d.deviceId;
      document.getElementById('dSub').textContent =
        `${groupName} · ${d.hostname || ''} · ${d.ip || '?'} · ${d.mac || ''} · v${d.appVersion || '?'} · last seen ${fmtAgo(d.lastSeenSec)}`;

      let reads = [];
      try {
        const res = await fetch(`/api/devices/${encodeURIComponent(d.deviceId)}/reads?limit=100`);
        reads = (await res.json()).reads || [];
      } catch (e) { /* keep empty */ }

      const imgUrl = `/api/devices/${encodeURIComponent(d.deviceId)}/cameras/${encodeURIComponent(cam.camera_name || '')}/image?t=${Date.now()}`;

      document.getElementById('dBody').innerHTML = `
        ${cam.last_image_at ? `<img class="detail-img" src="${imgUrl}" alt="last read image">` : ''}
        <div class="sec-title">Device Health</div>
        <div class="meters" style="grid-template-columns:repeat(5,1fr)">
          ${meterTile('Temp', h.cpuTempC != null ? h.cpuTempC + '&deg;C' : '-', h.cpuTempC != null ? Math.round(h.cpuTempC / 90 * 100) : null, 72, 83)}
          ${meterTile('CPU', h.cpu && h.cpu.loadPercent != null ? h.cpu.loadPercent + '%' : '-', h.cpu ? h.cpu.loadPercent : null, 70, 90)}
          ${meterTile('Disk', h.disk ? h.disk.usedPercent + '%' : '-', h.disk ? h.disk.usedPercent : null, 75, 85)}
          ${meterTile('RAM free', h.ram ? (h.ram.freeMb / 1024).toFixed(1) + 'GB' : '-', h.ram ? Math.round((h.ram.totalMb - h.ram.freeMb) / h.ram.totalMb * 100) : null, 80, 92)}
          ${meterTile('Uptime', h.uptimeSec != null ? Math.floor(h.uptimeSec / 86400) + 'd ' + Math.floor(h.uptimeSec % 86400 / 3600) + 'h' : '-', null)}
        </div>
        <div class="sec-title">Read History (${reads.length})</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Time</th><th>Camera</th><th>Value</th><th>Confidence</th></tr></thead>
            <tbody>
              ${reads.length ? reads.map(r => `
                <tr>
                  <td>${fmtTime(r.at)}</td>
                  <td>${esc(r.camera)}</td>
                  <td class="val-strong">${esc(r.value)}</td>
                  <td>${r.confidence != null ? Math.round(r.confidence * 100) + '%' : '-'}</td>
                </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;padding:1.2rem">ยังไม่มีประวัติการอ่าน</td></tr>'}
            </tbody>
          </table>
        </div>`;
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>

</html>
